name: Screenshots
on: workflow_dispatch
jobs:
  shots:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -viE "beta|RC" | sort -V | tail -1); sudo xcode-select -s "$XC"; xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild build -project EverySecondPays.xcodeproj -scheme EverySecondPays -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5
      - name: Capture
        run: |
          xcrun simctl list devices available | grep -E "Pro Max|Plus" || true
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for r in d for x in d[r] if 'Pro Max' in x['name']];print(c[-1]['udid'])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/EverySecondPays.app
          for L in zh-Hans en; do loc=$([ $L = en ] && echo en_US || echo zh_CN); mkdir -p shots/$L
            for S in main paywall settings; do
              xcrun simctl terminate "$UDID" com.limuye.everysecondpays 2>/dev/null || true
              xcrun simctl launch "$UDID" com.limuye.everysecondpays -ESPDemo $S -AppleLanguages "($L)" -AppleLocale $loc
              sleep 25; xcrun simctl io "$UDID" screenshot shots/$L/$S.png
            done; done
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: shots }
