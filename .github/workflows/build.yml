name: iOS Simulator Build
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|RC' | sort -V | tail -1); sudo xcode-select -s "$XC"; xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project EverySecondPays.xcodeproj -scheme EverySecondPays -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build.log }
