name: EverySecondPays
options:
  bundleIdPrefix: com.limuye
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: zh-Hans
settings:
  base:
    BUNDLE_ID: com.limuye.everysecondpays   # change here only
    APP_GROUP: group.com.limuye.everysecondpays
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: D53V28KTGW
targets:
  EverySecondPays:
    type: application
    platform: iOS
    sources: [EverySecondPays, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        INFOPLIST_FILE: EverySecondPays/Info.plist
        CODE_SIGN_ENTITLEMENTS: EverySecondPays/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release: { PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE) }
    dependencies: [{ target: EverySecondPaysWidget }]
  EverySecondPaysWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
      configs:
        Release: { PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROFILE) }
