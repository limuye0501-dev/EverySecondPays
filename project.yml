name: EverySecondPays
options:
  bundleIdPrefix: com.limuye
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: zh-Hans
settings:
  base:
    BUNDLE_ID: com.limuye.everysecondpays   # change here only
    APP_GROUP: group.com.limuye.everysecondpays
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "21"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: D53V28KTGW
targets:
  EverySecondPays:
    type: application
    platform: iOS
    sources:
      - path: EverySecondPays
        excludes: ["Products.storekit"]
      - Shared
      - path: EverySecondPays/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: EverySecondPays/Info.plist
        CODE_SIGN_ENTITLEMENTS: EverySecondPays/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release: { PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE) }
    dependencies:
      - target: EverySecondPaysWidget
      - sdk: SpriteKit.framework
    scheme:
      storeKitConfiguration: EverySecondPays/Products.storekit
      testTargets:
        - EverySecondPaysWidgetTests
  EverySecondPaysWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widget
        # Apple requires every app extension to be universal, even when the app is iPhone-only.
        # An iPhone-only widget extension renders blank on iPad (Guideline 4.4).
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
      configs:
        Release: { PROVISIONING_PROFILE_SPECIFIER: $(WIDGET_PROFILE) }
  EverySecondPaysWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EverySecondPaysTests
      - Shared
      - path: Widget
        excludes:
          - Info.plist
          - Widget.entitlements
          - "**/InfoPlist.strings"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.limuye.everysecondpays.widgettests
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG WIDGET_SNAPSHOT
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_SNAPSHOT
  # Drives the marketing-footage workflow only. Not part of the app scheme or archive.
  MarketingCapture:
    type: bundle.ui-testing
    platform: iOS
    sources: [MarketingCapture]
    dependencies:
      - target: EverySecondPays
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.limuye.everysecondpays.marketingcapture
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: EverySecondPays
    scheme:
      gatherCoverageData: false
      testTargets:
        - name: MarketingCapture
          parallelizable: false
